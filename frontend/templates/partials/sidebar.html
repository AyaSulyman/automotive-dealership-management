<aside class="app-sidebar" aria-label="Primary navigation">
    <div class="sidebar-brand">
        <span class="sidebar-brand__mark" aria-hidden="true">
            <svg viewBox="0 0 30 30">
                <path d="M4 7.5h15v12H4v-12Zm15 4h3.8l3.2 4v4h-7v-8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <circle cx="9" cy="21" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="22" cy="21" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
        </span>
        <span>
            <strong>AutoSource</strong>
            <small>Dealership Management</small>
        </span>
    </div>

    <nav class="sidebar-nav">
        <a class="sidebar-link{% if active_page == 'dashboard' %} is-active{% endif %}"
           href="{% url 'dashboard' %}"
           {% if active_page == 'dashboard' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7"/>
                <rect x="14" y="3" width="7" height="7"/>
                <rect x="3" y="14" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/>
            </svg>
            <span>Dashboard</span>
        </a>

        <a class="sidebar-link{% if '/inventory/' in request.path and '/deals/' not in request.path %} is-active{% endif %}"
           href="{% url 'inventory:inventory' %}"
           {% if '/inventory/' in request.path and '/deals/' not in request.path %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12.5 5.5 7h13l2.5 5.5V19h-2v2h-2v-2H7v2H5v-2H3v-6.5Z"/>
                <path d="M5 13h14M7 10h10"/>
                <circle cx="7" cy="16" r="1"/>
                <circle cx="17" cy="16" r="1"/>
            </svg>
            <span>Inventory &amp; Procurement</span>
        </a>

        <a class="sidebar-link{% if active_page == 'customers' %} is-active{% endif %}"
           href="{% url 'crm_finance:customers' %}"
           {% if active_page == 'customers' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="3"/>
                <path d="M3.5 20v-2c0-3 2.4-5 5.5-5s5.5 2 5.5 5v2H3.5ZM15 6.5c2.5 0 4 1.5 4 3.5s-1.5 3.5-4 3.5M16.5 14.5c2.5.5 4 2 4 4.5v1"/>
            </svg>
            <span>Customers</span>
        </a>

        <a class="sidebar-link{% if '/deals/' in request.path %} is-active{% endif %}"
           href="{% url 'inventory:deal-add' %}"
           {% if '/deals/' in request.path %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 4h8l10 10-7 7L4 11V4Z"/>
                <circle cx="8" cy="8" r="1.2"/>
            </svg>
            <span>Sales &amp; Trade-Ins</span>
        </a>

        {% if user_identity.role == 'admin' or user_identity.role == 'accountant' %}
        <a class="sidebar-link{% if active_page == 'payments' %} is-active{% endif %}"
           href="{% url 'crm_finance:payments' %}"
           {% if active_page == 'payments' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="6" width="18" height="12" rx="1.5"/>
                <circle cx="12" cy="12" r="3"/>
                <path d="M6 9h1M17 15h1"/>
            </svg>
            <span>Payments &amp; Financing</span>
        </a>

        <a class="sidebar-link{% if active_page == 'finance' %} is-active{% endif %}"
           href="{% url 'crm_finance:finance-reports' %}"
           {% if active_page == 'finance' %}aria-current="page"{% endif %}>
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="3" width="16" height="18" rx="1.5"/>
                <path d="M8 16v2M12 12v6M16 8v10"/>
            </svg>
            <span>Finance &amp; Reports</span>
        </a>
        {% endif %}
    </nav>
</aside>

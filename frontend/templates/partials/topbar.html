<header class="app-topbar">
    <div class="topbar-left">
        <label class="icon-button mobile-menu-button" for="sidebar-state" aria-label="Open navigation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </label>
        <a class="topbar-brand" href="{% url 'dashboard' %}">AutoSource <span>ADMS</span></a>
    </div>

    <div class="topbar-actions">
        <span class="icon-button is-static" title="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 17h14l-1.5-2v-4.5a5.5 5.5 0 0 0-11 0V15L5 17ZM10 20h4"/></svg>
            <span class="notification-dot" aria-hidden="true"></span>
        </span>
        <span class="icon-button topbar-settings is-static" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63h.01A1.7 1.7 0 0 0 10 3.08V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9v.01A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </span>
        <span class="topbar-divider" aria-hidden="true"></span>
        <div class="profile-summary">
            <span class="profile-summary__text">
                <strong>{{ user_identity.name|default:"Employee Profile" }}</strong>
                <small>{{ user_identity.role_display|default:"Employee" }}</small>
            </span>
            <span class="profile-avatar" aria-hidden="true">{{ user_identity.initials|default:"EP" }}</span>
        </div>
    </div>
</header>
